# Render Blueprint (optional). Dashboard → New → Blueprint → pick this repo.
# Values marked sync:false are asked for once in the dashboard; never commit real keys (the repo is public).
services:
  - type: web
    name: swarm-negotiator
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: EXECUTION_MODE
        value: simulation
      - key: BOLNA_TELEPHONY_PROVIDER
        value: plivo
      - key: BOLNA_AGENT_LANGUAGES
        value: hi,kn          # the other call languages are created on first use
      - key: KEEP_AWAKE_MINUTES
        value: "0"            # set to 10 to keep the free instance awake (fits in the free 750 h/month)
      - key: AUTO_CALL_COUNT
        value: "3"
      - key: GEMINI_API_KEY
        sync: false
      - key: BOLNA_API_KEY
        sync: false
      - key: LIVE_TEST_PHONE
        sync: false
      - key: TOOL_SHARED_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
