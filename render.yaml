services:
  - type: web
    name: swarm-negotiator
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: EXECUTION_MODE
        value: simulation
      - key: GEMINI_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: BOLNA_API_KEY
        sync: false
      - key: TOOL_SHARED_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
